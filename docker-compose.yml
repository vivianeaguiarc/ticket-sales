services:
  mysql:
    image: mysql:8.0.30-debian
    container_name: ticket-sales-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-tickets}
    ports:
      - '${DB_HOST_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-p${DB_PASSWORD:-root}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-sales-api
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-tickets}
      JWT_SECRET: ${JWT_SECRET:-your_secret_key}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
